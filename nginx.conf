server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/x-yaml text/yaml application/json;

    # sites.yaml peut être modifié à chaud (volume monté) : on évite que le
    # navigateur ou un proxy intermédiaire ne le mette en cache trop longtemps.
    location = /sites.yaml {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Pas de cache long : un simple rechargement doit récupérer le HTML,
    # le JS et le CSS (sinon les onglets déjà ouverts gardent l'ancienne page).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # L'API OWLNET n'envoie pas Access-Control-Allow-Origin : le navigateur
    # ne peut pas l'appeler directement. Nginx relaie donc /owlnet/ vers
    # leur API (même origine que la page). Pas de backend applicatif.
    location /owlnet/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $owlnet_upstream https://owlnet.kasi.re.kr:8080;
        rewrite ^/owlnet/(.*)$ /$1 break;
        proxy_pass $owlnet_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name owlnet.kasi.re.kr;
        proxy_set_header Host owlnet.kasi.re.kr;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_connect_timeout 15s;
        proxy_read_timeout 45s;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
